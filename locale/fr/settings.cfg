[mod-setting-name]
more-ammo-require-empty-magazines=Exiger des chargeurs et douilles vides

[mod-setting-description]
more-ammo-require-empty-magazines=Si cette option est décochée, conserve les recettes d'origine des munitions du jeu de base. Les munitions ajoutées par More Ammo utilisent des chargeurs standard à la place des chargeurs vides ; les munitions à eau, cryonite, iridium, vulcanite, béryllium et naquium de Space Exploration utilisent des chargeurs perforants à la place des chargeurs avancés. Les autres ingrédients restent inchangés. Les variantes à grande capacité suivent ces chaînes ; les réglages de coût des contenants vides ne les affectent plus. Activé par défaut. Nécessite un redémarrage.
